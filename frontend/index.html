<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/htmx.org@2.0.1"></script>
    <title>SUBTISEARCH</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        background-color: var(--black);
        color: var(--white);
        font-family: sans-serif;
        font-size: 18px;
        --white: #e0e0e0;
        --black: #1f1f1f;
        --red: #ff766C;
      }

      input {
        font: inherit;
        background-color: var(--white);
        border: none;
        padding: 8px 12px;
      }

      span {
        font-weight: bold;
        color: var(--red);
      }
    </style>
  </head>
  <body>
    <input
      type="text"
      name="q"
      hx-get="search/"
      hx-trigger="keyup changed delay: 500ms"
      hx-target="#searchResuts"
      _="on change if my.value !=='' trigger doRequest"
    />
    <hr />
    <div class="search-resuts" id="searchResuts"></div>
  </body>
</html>
