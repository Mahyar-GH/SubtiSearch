<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/htmx.org@2.0.1"></script>
    <title>SUBTISEARCH</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        background-color: var(--black);
        color: var(--white);
        font-family: sans-serif;
        font-size: 22px;
        --white: hsl(0, 0%, 88%);
        --gray: hsl(0, 0%, 35%);
        --black: hsl(0, 0%, 12%);
        --red: #ff766C;
      }

      input {
        font: inherit;
        background-color: var(--white);
        border: none;
        padding: 8px 12px;
      }

      span {
        font-weight: bold;
        color: var(--red);
      }

      hr, .src {
        color: var(--gray);
        font-size: 15px;
      }

      .search-results {
        width: 75%;
        max-width: 800px;
        margin-inline: auto;
      }
    </style>
  </head>
  <body>
    <input
      type="text"
      name="q"
      hx-get="/search/{{ limit }}/"
      hx-trigger="keyup changed delay:250ms"
      hx-target="#searchResuts"
    />
    <hr />
    <div class="search-results" id="searchResuts"></div>
  </body>
</html>
